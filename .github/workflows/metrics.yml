name: Update Metrics

on:
  schedule:
    # Update setiap hari jam 00:00 UTC (07:00 WIB)
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@v4
        with:
          github_user_name: tiarasani-anita
          plugin_languages: no
          config_output: markdown
