name: Update Metrics

on:
  schedule:
    # Update setiap hari jam 00:00 UTC (07:00 WIB)
    - cron: '0 0 * * *'
  # Update manual via Actions tab
  workflow_dispatch:
  # Update saat push ke main
  push:
    branches: [main]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: Tiarasani-anita
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Jakarta
          plugin_achievements: yes
          plugin_followup: yes
          plugin_gists: yes
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_habits_charts_separators: yes
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_from: 200
          plugin_introduction: yes
          plugin_introduction_title: "## 👋 Hi there, I'm Anita!"
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repo: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_details: lines, bytes-size, percentage
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_sections: most-used, recently-used, categories
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_recent_days: 7
          plugin_lines_sections: base
          plugin_notable: yes
          plugin_notable_from: organization
          plugin_notable_repositories: yes
          plugin_notable_types: commit, pull, issue, release
          plugin_people: yes
          plugin_people_limit: 24
          plugin_people_size: 28
          plugin_people_types: followers, following, stargazers
          plugin_recent: yes
          plugin_recent_days: 14
          plugin_recent_limit: 5
          plugin_starlists: yes
          plugin_starlists_categories: all
          plugin_starlists_limit: 4
          plugin_starlists_sections: categories, repositories
          plugin_traffic: yes
          plugin_traffic_days: 14
          plugin_traffic_histo: yes
          plugin_traffic_limit: 5